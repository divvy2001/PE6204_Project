<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURITY ALERT</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #050505;
            color: #ff3333;
            font-family: "Courier New", monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .screen {
            width: 90%;
            max-width: 850px;
            text-align: center;
            border: 2px solid #ff3333;
            padding: 50px 30px;
            box-shadow:
                0 0 20px #ff0000,
                inset 0 0 30px rgba(255, 0, 0, 0.08);
            animation: flicker 3s infinite;
        }

        .warning {
            font-size: 70px;
            font-weight: bold;
            letter-spacing: 8px;
            text-shadow:
                0 0 10px #ff0000,
                0 0 30px #ff0000;
            animation: glitch 1.5s infinite;
        }

        .subtitle {
            margin-top: 20px;
            font-size: 22px;
            color: #ff7777;
        }

        .terminal {
            margin: 35px auto;
            max-width: 600px;
            text-align: left;
            background: #090909;
            border: 1px solid #441111;
            padding: 20px;
            color: #cc4444;
            line-height: 1.8;
        }

        .terminal span {
            color: #ff2222;
        }

        .demo {
            margin-top: 30px;
            color: #888;
            font-size: 13px;
        }

        @keyframes glitch {
            0%, 90%, 100% {
                transform: translateX(0);
            }

            92% {
                transform: translateX(-5px);
            }

            94% {
                transform: translateX(5px);
            }

            96% {
                transform: translateX(-3px);
            }
        }

        @keyframes flicker {
            0%, 95%, 100% {
                opacity: 1;
            }

            96% {
                opacity: 0.85;
            }

            97% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

<div class="screen">

    <div class="warning">YOU'RE HACKED</div>

    <div class="subtitle">
        UNAUTHORIZED ACCESS DETECTED
    </div>

    <div class="terminal">
        <div>&gt; CONNECTION ESTABLISHED</div>
        <div>&gt; EXTERNAL CONTENT EXECUTED</div>
        <div>&gt; SOURCE: <span>ASKNARELLE</span></div>
        <div>&gt; STATUS: <span>COMPROMISED</span></div>
        <div>&gt; SECURITY BOUNDARY: <span>BREACHED</span></div>
    </div>

    <div class="demo">
        ⚠ SC1003 SECURITY DEMONSTRATION ⚠<br><br>
        No real data was accessed or compromised.
    </div>

</div>

</body>
</html>
